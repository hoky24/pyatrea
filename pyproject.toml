[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyatrea"
version = "0.9.9.2"
description = "Async Python client for Atrea ventilation units"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "demjson3>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "aioresponses>=0.7", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["pyatrea*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
