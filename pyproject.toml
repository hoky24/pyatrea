[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyatrea"
version = "0.10.0"
description = "Async Python client for Atrea ventilation units"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "demjson3>=3", "pymodbus>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "aioresponses>=0.7", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["pyatrea*"]

[tool.setuptools.package-data]
pyatrea = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true

# demjson3 ships no type stubs (3rd-party untyped dependency). Scope the
# missing-import suppression to that module so pyatrea's own code stays strict.
[[tool.mypy.overrides]]
module = ["demjson3"]
ignore_missing_imports = true
